<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>通用神经网络训练实验室</title>
<style>
body{margin:0;background:#08121c;color:#eaf4f7;font:14px ui-monospace,monospace}*{box-sizing:border-box}.app{max-width:1200px;margin:auto;padding:18px}.cols{display:grid;grid-template-columns:320px 1fr;gap:14px}.p{background:#0d1a26;border:1px solid #21384b;border-radius:14px;padding:14px;margin-bottom:14px}h1{font-size:20px}h2{font-size:13px;color:#9fb4c2}#pad{width:100%;aspect-ratio:1;background:#000;border-radius:12px;touch-action:none}.row{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}button,input{background:#122333;color:#eaf4f7;border:1px solid #315069;border-radius:8px;padding:9px}button{cursor:pointer}.go{color:#8ff0d0;border-color:#3c987d}.digits{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:8px}.sel{outline:2px solid #62e6bd}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.s{border:1px solid #21384b;padding:10px;border-radius:10px}.s b{font-size:20px;color:#62e6bd;display:block}.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:10px 0}.controls input{width:100%}#net,#chart{width:100%;border-radius:10px;background:#091520;margin-top:10px}.prob{display:grid;grid-template-columns:20px 1fr 50px;gap:5px;margin:5px}.bar{background:#162a39;height:8px;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:#62e6bd}.muted{color:#8096a5;font-size:11px;line-height:1.5}@media(max-width:750px){.cols{grid-template-columns:1fr}.controls{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="app"><h1>NEURAL LAB · 自定义样本分类器</h1><div class="cols"><div>
<div class="p"><h2>1. 创建类别 + 制作样本</h2><canvas id="pad" width="280" height="280"></canvas><div class="row"><button id="clear">清空</button><button id="undo">撤销上一样本</button></div><div class="digits" id="digits"></div><button class="go" id="add" style="width:100%;margin-top:8px">添加为数字 0</button><p id="info">样本 0</p><div class="muted">创建任意类别，例如“土豆 / 石头 / 苹果”。可画样本，也可上传图片；每类建议至少 10–30 个。</div></div>
<div class="p"><h2>3. 测试新样本</h2><button class="go" id="predict">识别当前画板</button><div id="ans" style="font-size:34px;color:#62e6bd;margin:10px 0">?</div><div id="probs"></div></div></div>
<div><div class="p"><h2>2. 真正训练</h2><div class="stats"><div class="s"><b id="ep">0</b>Epoch</div><div class="s"><b id="loss">—</b>Loss</div><div class="s"><b id="acc">—</b>Accuracy</div><div class="s"><b id="n">0</b>Samples</div></div>
<div class="controls"><label>学习率<input id="lr" value=".03" type="number" step=".005"></label><label>Batch<input id="bs" value="8" type="number"></label><label>隐藏层<input id="hs" value="32" type="number" step="8"></label><label>训练轮数<input id="es" value="30" type="number"></label></div>
<div class="row"><button class="go" id="train">▶ 开始训练</button><button id="one">训练1轮</button><button id="stop">暂停</button><button id="reset">重置模型</button></div><canvas id="net" width="800" height="340"></canvas><canvas id="chart" width="800" height="150"></canvas>
<div class="row"><button id="em">导出模型</button><button id="im">导入模型</button><button id="ed">导出数据</button><button id="id">导入数据</button><input id="file" type="file" accept=".json" hidden></div>
<p class="muted">64 像素输入 → ReLU 隐藏层 → 动态类别输出。执行真实前向传播、交叉熵和反向传播；类别、数据和模型都由你自己创建。</p></div></div></div></div>
<script>
const $=s=>document.querySelector(s),pad=$('#pad'),g=pad.getContext('2d',{willReadFrequently:true});
g.strokeStyle='white';g.lineWidth=22;g.lineCap='round';
let down=0,last,classes=['类别A','类别B'],lab=0,data=[],M=null,epoch=0,run=0,L=[];
function xy(e){let r=pad.getBoundingClientRect();return[(e.clientX-r.left)*280/r.width,(e.clientY-r.top)*280/r.height]}
pad.onpointerdown=e=>{down=1;last=xy(e);pad.setPointerCapture(e.pointerId)};pad.onpointermove=e=>{if(!down)return;let p=xy(e);g.beginPath();g.moveTo(...last);g.lineTo(...p);g.stroke();last=p};pad.onpointerup=()=>down=0;
$('#clear').onclick=()=>g.clearRect(0,0,280,280);
const D=$('#digits'); D.style.gridTemplateColumns='repeat(2,1fr)';
let manage=document.createElement('div');manage.className='row';manage.innerHTML='<input id="cn" placeholder="新类别名" style="flex:1"><button id="ac">＋类别</button><button id="rc">删当前类别</button>';D.before(manage);
let upload=document.createElement('div');upload.className='row';upload.innerHTML='<button id="up">上传图片作为当前类别样本</button><input id="imgfile" type="file" accept="image/*" multiple hidden>';$('#add').after(upload);
function renderClasses(){D.innerHTML='';classes.forEach((name,i)=>{let b=document.createElement('button');b.textContent=name;b.className=i===lab?'sel':'';b.onclick=()=>{lab=i;renderClasses()};D.append(b)});$('#add').textContent='添加画板样本 → '+classes[lab];refresh()}
function prepCanvas(c){let q=c.getContext('2d',{willReadFrequently:true}),w=c.width,h=c.height,d=q.getImageData(0,0,w,h).data,x0=w,y0=h,x1=-1,y1=-1;for(let y=0;y<h;y++)for(let x=0;x<w;x++){let k=(y*w+x)*4,bright=(d[k]+d[k+1]+d[k+2])/3;if(d[k+3]>10&&bright>18){x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y)}}if(x1<0)return null;let side=Math.max(x1-x0,y1-y0)*1.35,cx=(x0+x1)/2,cy=(y0+y1)/2,t=document.createElement('canvas');t.width=t.height=8;let z=t.getContext('2d');z.fillStyle='#000';z.fillRect(0,0,8,8);z.drawImage(c,cx-side/2,cy-side/2,side,side,0,0,8,8);let a=z.getImageData(0,0,8,8).data,out=[];for(let i=0;i<64;i++)out.push(((a[i*4]+a[i*4+1]+a[i*4+2])/3)/255);return out}
function prep(){return prepCanvas(pad)}
function refresh(){let c=Array(classes.length).fill(0);data.forEach(s=>{if(s.y<c.length)c[s.y]++});$('#info').textContent='总样本 '+data.length+' ｜ '+c.map((v,i)=>classes[i]+':'+v).join(' · ');$('#n').textContent=data.length}
$('#ac').onclick=()=>{let n=$('#cn').value.trim();if(!n)return;classes.push(n);lab=classes.length-1;$('#cn').value='';M=null;renderClasses();net()};
$('#rc').onclick=()=>{if(classes.length<=2)return alert('至少保留两个类别');let old=lab;data=data.filter(s=>s.y!==old).map(s=>({x:s.x,y:s.y>old?s.y-1:s.y}));classes.splice(old,1);lab=Math.max(0,old-1);M=null;renderClasses();net()};
$('#add').onclick=()=>{let x=prep();if(!x)return alert('先画一个样本');data.push({x,y:lab});refresh();g.clearRect(0,0,280,280)};$('#undo').onclick=()=>{data.pop();refresh()};
$('#up').onclick=()=>$('#imgfile').click();$('#imgfile').onchange=e=>{[...e.target.files].forEach(f=>{let im=new Image();im.onload=()=>{let c=document.createElement('canvas');c.width=c.height=280;let q=c.getContext('2d');q.fillStyle='#000';q.fillRect(0,0,280,280);let s=Math.min(260/im.width,260/im.height),w=im.width*s,h=im.height*s;q.drawImage(im,(280-w)/2,(280-h)/2,w,h);let x=prepCanvas(c);if(x){data.push({x,y:lab});refresh()}};im.src=URL.createObjectURL(f)});e.target.value=''};
const rnd=s=>(Math.random()*2-1)*s;
function init(){let h=+$('#hs').value,K=classes.length;M={h,K,w1:Array.from({length:h},()=>Array.from({length:64},()=>rnd(.18))),b1:Array(h).fill(0),w2:Array.from({length:K},()=>Array.from({length:h},()=>rnd(.18))),b2:Array(K).fill(0)}}
function sm(z){let m=Math.max(...z),a=z.map(v=>Math.exp(v-m)),s=a.reduce((a,b)=>a+b);return a.map(v=>v/s)}
function fw(x){let z=M.w1.map((r,j)=>r.reduce((s,w,i)=>s+w*x[i],M.b1[j])),a=z.map(v=>Math.max(0,v)),o=M.w2.map((r,k)=>r.reduce((s,w,j)=>s+w*a[j],M.b2[k]));return{z,a,p:sm(o)}}
function metric(){let loss=0,ok=0;for(let s of data){let p=fw(s.x).p;loss-=Math.log(Math.max(p[s.y],1e-9));if(p.indexOf(Math.max(...p))==s.y)ok++}loss/=data.length;L.push(loss);$('#ep').textContent=epoch;$('#loss').textContent=loss.toFixed(3);$('#acc').textContent=(ok/data.length*100).toFixed(1)+'%';chart()}
async function step(){if(!M||M.K!==classes.length)init();let ids=[...data.keys()].sort(()=>Math.random()-.5),bs=Math.max(1,+$('#bs').value),lr=+$('#lr').value;for(let q=0;q<ids.length;q+=bs){let B=ids.slice(q,q+bs),g1=M.w1.map(r=>r.map(()=>0)),gb1=Array(M.h).fill(0),g2=M.w2.map(r=>r.map(()=>0)),gb2=Array(M.K).fill(0);for(let ii of B){let s=data[ii],o=fw(s.x),dz=o.p.slice();dz[s.y]-=1;let da=Array(M.h).fill(0);for(let k=0;k<M.K;k++){gb2[k]+=dz[k];for(let j=0;j<M.h;j++){g2[k][j]+=dz[k]*o.a[j];da[j]+=M.w2[k][j]*dz[k]}}for(let j=0;j<M.h;j++){let v=o.z[j]>0?da[j]:0;gb1[j]+=v;for(let i=0;i<64;i++)g1[j][i]+=v*s.x[i]}}let r=lr/B.length;for(let j=0;j<M.h;j++){M.b1[j]-=r*gb1[j];for(let i=0;i<64;i++)M.w1[j][i]-=r*g1[j][i]}for(let k=0;k<M.K;k++){M.b2[k]-=r*gb2[k];for(let j=0;j<M.h;j++)M.w2[k][j]-=r*g2[k][j]}}epoch++;metric();net();await new Promise(r=>setTimeout(r,0))}
async function train(n){if(data.length<4)return alert('先为至少两个类别添加一些样本');if(new Set(data.map(x=>x.y)).size<2)return alert('至少需要两个有样本的类别');run=1;for(let i=0;i<n&&run;i++)await step();run=0}
$('#train').onclick=()=>train(+$('#es').value);$('#one').onclick=()=>train(1);$('#stop').onclick=()=>run=0;$('#reset').onclick=()=>{init();epoch=0;L=[];$('#ep').textContent=0;$('#loss').textContent=$('#acc').textContent='—';net();chart()};
$('#predict').onclick=()=>{let x=prep();if(!x)return alert('先画测试样本');if(!M)return alert('先训练模型');let p=fw(x).p,m=p.indexOf(Math.max(...p));$('#ans').textContent='预测：'+classes[m];$('#probs').innerHTML=p.map((v,i)=>'<div class="prob"><span>'+classes[i]+'</span><div class="bar"><i style="width:'+(v*100)+'%"></i></div><span>'+(v*100).toFixed(1)+'%</span></div>').join('')};
function net(){if(!M)init();let c=$('#net'),q=c.getContext('2d'),W=c.width,H=c.height;q.clearRect(0,0,W,H);q.fillStyle='#8096a5';q.fillText('64 INPUT',20,20);q.fillText(M.h+' HIDDEN',300,20);q.fillText(classes.length+' CLASSES',690,20);let A=Array.from({length:8},(_,i)=>[60,45+i*38]),B=Array.from({length:Math.min(M.h,12)},(_,i)=>[360,35+i*25]),C=Array.from({length:Math.min(classes.length,10)},(_,i)=>[720,45+i*26]);q.strokeStyle='rgba(98,230,189,.09)';for(let a of A)for(let b of B){q.beginPath();q.moveTo(...a);q.lineTo(...b);q.stroke()}for(let a of B)for(let b of C){q.beginPath();q.moveTo(...a);q.lineTo(...b);q.stroke()}for(let a of [...A,...B,...C]){q.beginPath();q.arc(...a,7,0,7);q.fillStyle='#2b7568';q.fill()}}
function chart(){let c=$('#chart'),q=c.getContext('2d'),W=c.width,H=c.height;q.clearRect(0,0,W,H);if(L.length<2)return;q.strokeStyle='#62e6bd';q.beginPath();let mx=Math.max(...L,1);L.forEach((v,i)=>{let x=10+i*(W-20)/(L.length-1),y=H-10-v/mx*(H-20);i?q.lineTo(x,y):q.moveTo(x,y)});q.stroke()}
function dl(obj,name){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(obj)],{type:'application/json'}));a.download=name;a.click()}
$('#em').onclick=()=>M?dl({type:'model',classes,M,epoch},'custom-model.json'):alert('还没有模型');$('#ed').onclick=()=>dl({type:'data',classes,data},'custom-dataset.json');
let mode='';$('#im').onclick=()=>{mode='m';$('#file').click()};$('#id').onclick=()=>{mode='d';$('#file').click()};$('#file').onchange=async e=>{let o=JSON.parse(await e.target.files[0].text());classes=o.classes||classes;if(mode==='m'){M=o.M;epoch=o.epoch||0;$('#hs').value=M.h}else{data=o.data||[]}lab=0;renderClasses();net();e.target.value=''};
renderClasses();init();net();chart();
</script></body></html>
